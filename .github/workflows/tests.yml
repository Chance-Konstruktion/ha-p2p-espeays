name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No Home Assistant: the floor-plan conformance kit is built to run
      # without it, and tests/conftest.py stubs the two helpers the adapter
      # actually touches. Anything more would be a 300 MB dependency for
      # two lookups.
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio
      - name: Run unit tests
        run: python -m pytest -q
